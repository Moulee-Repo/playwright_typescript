services:
  playwright-tests:
    build:
      context: .
    init: true
    shm_size: 1gb
    environment:
      CI: "true"
      PLAYWRIGHT_DOCKER: "true"
      BROWSERSTACK_USERNAME: "${BROWSERSTACK_USERNAME:-}"
      BROWSERSTACK_ACCESS_KEY: "${BROWSERSTACK_ACCESS_KEY:-}"
      BROWSERSTACK_BROWSER_VERSION: "${BROWSERSTACK_BROWSER_VERSION:-}"
      BROWSERSTACK_OS: "${BROWSERSTACK_OS:-}"
      BROWSERSTACK_OS_VERSION: "${BROWSERSTACK_OS_VERSION:-}"
      BROWSERSTACK_PROJECT_NAME: "${BROWSERSTACK_PROJECT_NAME:-}"
      BROWSERSTACK_BUILD_NAME: "${BROWSERSTACK_BUILD_NAME:-}"
    volumes:
      - ./reports:/app/reports
      - ./test-results:/app/test-results
