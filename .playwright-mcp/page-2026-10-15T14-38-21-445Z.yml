  - generic [ref=f8e800]:
    - heading "Frequently Asked Questions" [level=2] [ref=f8e801]
    - generic [ref=f8e804]:
      - generic [ref=f8e807]:
        - button "Is AURA just AI-powered testing with a new name?" [ref=f8e808] [cursor=pointer]
        - paragraph [ref=f8e814]: No. While most AI testing tools focus on writing and maintaining tests faster, AURA works at a deeper level to improve release assurance across the full delivery lifecycle. The Sauce Labs platform extracts business intent, generates and runs your tests, correlates failures against nearly two decades of execution data, and closes the loop from production errors back into coverage. The payoff is confidence in software delivery that moves faster and still holds up under scrutiny.
      - generic [ref=f8e817]:
        - button "We already use AI coding assistants to generate tests. Why do we need AURA?" [ref=f8e818] [cursor=pointer]
        - paragraph [ref=f8e824]: Generating a test and verifying software are two different jobs. An AI assistant writes the script, whereas AURA runs your app on real devices and tells you what actually happened, remembers which tests fail intermittently, and catches the visual issues a model can’t see on a screen. With 40% of new AI-assisted code getting rewritten within two weeks and roughly half of AI-generated code failing its first review, generating faster without verification just moves the bottleneck downstream.
      - generic [ref=f8e827]:
        - button "Couldn’t we build a solution like AURA ourselves?" [ref=f8e828] [cursor=pointer]
        - paragraph [ref=f8e834]: "You can build the infrastructure, but you can’t build the dataset. The infrastructure is within reach: a device fleet, parallel execution, failure analytics, and ongoing maintenance, but it ties up your most expensive engineers on work that doesn’t differentiate your product. AURA’s AI is informed by learnings from more than 8.7 billion test runs over nearly two decades, and an in-house build starts from zero history. Forrester's Total Economic Impact study of Sauce Labs put the infrastructure savings alone at $1.3M over three years."
      - generic [ref=f8e837]:
        - button "Will AURA fit our existing tech stack?" [ref=f8e838] [cursor=pointer]
        - paragraph [ref=f8e844]: "Adoption fails when a tool demands a workflow change. AURA embeds where developers already work: VS Code, JetBrains, Cursor, Claude Code, and Copilot, plus agent access through the Sauce Labs MCP Server, every major delivery pipeline, and full support for Selenium, Cypress, Appium, and Playwright. Nothing migrates. Enter as an addition to the stack, starting with end-to-end or functional interface testing."
      - generic [ref=f8e847]:
        - button "Do we need specialized expertise to use AURA?" [ref=f8e848] [cursor=pointer]
        - paragraph [ref=f8e854]: No. With intent-based authoring, anyone can describe a user journey in plain language, “log in, add to cart, check out”, and get an executable test across web and mobile, with full code control whenever your engineers want it. Test creation runs up to 80% faster, taking teams from ideas to running tests in minutes. Support scales up to around-the-clock with dedicated technical account managers.
      - generic [ref=f8e857]:
        - button "How reliable are the test results?" [ref=f8e858] [cursor=pointer]
        - paragraph [ref=f8e864]: Most flakiness stems from brittle, selector-based tests rather than the underlying infrastructure. AI-authored tests survive interface changes and cut breaking changes by 75%, and every run returns video, screenshots, logs, and network captures, so failures are explainable rather than a mystery. Sauce AI for Insights flags flaky patterns across runs before they cost you a release.
      - generic [ref=f8e867]:
        - button "What security and compliance certifications do you hold?" [ref=f8e868] [cursor=pointer]
        - generic [ref=f8e873]:
          - paragraph [ref=f8e874]: Sauce Labs is ISO/IEC 42001 certified — the first international standard for responsible AI management — alongside ISO 27001, ISO 27701, SOC 2 Type II, and alignment with GDPR/CCPA.
          - paragraph [ref=f8e875]: Enterprise customers can request a full security review through our Trust Center.
      - generic [ref=f8e878]:
        - button "Why should we trust Sauce Labs?" [ref=f8e879] [cursor=pointer]
        - paragraph [ref=f8e885]: Our founders created Selenium and Appium, the frameworks that much of enterprise testing still runs on today. The platform has executed more than 8.7 billion tests over nearly two decades, and more than 300,000 enterprise users depend on it, including over 80% of the top 10 F2000 banks. You can likely verify with a peer reference in your own industry.
